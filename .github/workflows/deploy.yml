name: Build and Deploy Haqqai

on:
  push:
    branches:
      - ft/change

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: devnatnaels/haqqai-backend:latest
          platforms: linux/arm64
          cache-from: type=registry,ref=devnatnaels/haqqai-backend:cache
          cache-to: type=registry,ref=devnatnaels/haqqai-backend:cache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: devnatnaels/haqqai-web:latest
          platforms: linux/arm64
          cache-from: type=registry,ref=devnatnaels/haqqai-web:cache
          cache-to: type=registry,ref=devnatnaels/haqqai-web:cache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "deployment/"
          target: "/home/ubuntu/haqqai"

      - name: Deploy on Oracle server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            # Fix permissions
            sudo chown -R ubuntu:ubuntu /home/ubuntu/haqqai/

            cd /home/ubuntu/haqqai/deployment/docker_compose

            # Create .env if it doesn't exist
            if [ ! -f .env ]; then
              cp env.template .env 2>/dev/null || touch .env
            fi

            # Fix web_server health check dependency for nginx
            sed -i 's/condition: service_healthy$/condition: service_started/' docker-compose.prod.yml

            # Ensure nginx config files are executable
            chmod +x /home/ubuntu/haqqai/deployment/data/nginx/run-nginx.sh

            # Pull latest images
            docker compose -f docker-compose.prod.yml pull

            # Restart with new images
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            # Clean up old images
            docker image prune -f